name: obsidian and finance tests

# Runs both pytest suites on every PR that touches either plugin
# (or the workflow itself), and on every push to main that changes
# the plugin.

on:
  pull_request:
    paths:
      - 'obsidian/**'
      - 'obsidian-finance/**'
      - '.claude-plugin/marketplace.json'
      - 'tests/**'
      - 'LICENSE'
      - 'ATTRIBUTION.md'
      - '.github/workflows/test-obsidian.yml'
  push:
    branches: [main]
    paths:
      - 'obsidian/**'
      - 'obsidian-finance/**'
      - '.claude-plugin/marketplace.json'
      - 'tests/**'
      - 'LICENSE'
      - 'ATTRIBUTION.md'
      - '.github/workflows/test-obsidian.yml'

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install --quiet 'pytest>=7' 'PyYAML>=6.0.2'

      - name: Run obsidian and finance pytest suites
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m pytest obsidian/tests obsidian-finance/tests -q -p no:cacheprovider
